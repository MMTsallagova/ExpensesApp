<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2b4a8b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Расходы">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Расходы</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
/* Layout: одна колонка-ленточка до 980px, шапка с переключателем месяца, вкладки, карточки по ролям; плавающая кнопка «Добавить». Палитра — японский индиго (ай) на прохладной бумаге. */
:root{
  --bg:#f3f5f9; --surface:#ffffff; --surface-2:#eef1f7; --ink:#151a2b; --ink-2:#4a5169; --muted:#7a8199; --line:#dfe3ec;
  --accent:#2b4a8b; --accent-ink:#ffffff; --accent-soft:#e3e9f6; --stamp:#c2362c;
  --good:#1f7a43; --good-soft:#e2f2e8; --warn:#9a6200; --warn-soft:#fbf0d9; --bad:#b3261e; --bad-soft:#fbe5e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif; --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:12px; --shadow:0 1px 2px rgba(20,30,60,.06),0 4px 16px rgba(20,30,60,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f121a; --surface:#181c27; --surface-2:#202534; --ink:#eceff7; --ink-2:#b5bbd0; --muted:#868da5; --line:#2b3142;
  --accent:#93acea; --accent-ink:#0f1424; --accent-soft:#232c45; --stamp:#ec6a5f;
  --good:#5cc489; --good-soft:#173525; --warn:#e2ac45; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#3d1c1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f121a; --surface:#181c27; --surface-2:#202534; --ink:#eceff7; --ink-2:#b5bbd0; --muted:#868da5; --line:#2b3142;
  --accent:#93acea; --accent-ink:#0f1424; --accent-soft:#232c45; --stamp:#ec6a5f;
  --good:#5cc489; --good-soft:#173525; --warn:#e2ac45; --warn-soft:#3a2d12; --bad:#f08a80; --bad-soft:#3d1c1a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
.wrap{max-width:980px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-family:var(--f-mono);letter-spacing:-.01em}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:500;font-size:17px;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:14px 0}
.brand{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand-l{display:flex;align-items:center;gap:10px;min-width:0}
.brand h1{font-family:var(--f-display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand .sub{font-size:12px;color:var(--muted)}
.monthnav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.monthnav button{border:0;background:transparent;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--ink-2)}
.monthnav button:hover{background:var(--surface-2)}
.monthnav .m{min-width:128px;text-align:center;font-weight:700;font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:38px;padding:0 12px;font-size:13px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:12px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:10px 12px;color:var(--ink-2);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs a[aria-current="page"]{color:var(--ink);border-color:var(--accent)}
.banner{margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13px;display:flex;gap:10px;align-items:flex-start}
.banner.demo{background:var(--warn-soft);color:var(--ink)}
.banner.info{background:var(--accent-soft)}
main{display:grid;gap:16px;margin-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.hero{display:flex;flex-wrap:wrap;gap:16px 32px;align-items:flex-end}
.big{font-family:var(--f-display);font-size:clamp(30px,7vw,44px);font-weight:500;letter-spacing:-.03em;line-height:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.up{background:var(--bad-soft);color:var(--bad)} .chip.down{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.people{display:flex;gap:20px;flex-wrap:wrap}
.people div{display:grid;gap:2px}
.stackbar{display:flex;height:14px;border-radius:7px;overflow:hidden;gap:2px;background:var(--surface-2)}
.stackbar span{display:block;min-width:2px}
.rows{display:grid}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.sw{width:10px;height:10px;border-radius:3px;flex:none}
.tx{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--line);cursor:pointer;border-radius:6px}
.tx:hover{background:var(--surface-2)}
.tx .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.tx .meta{font-size:12px;color:var(--muted)}
.tag{font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-weight:600}
.daylabel{font-size:12px;color:var(--muted);font-weight:600;padding:12px 4px 4px}
.check{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.check.done .t{color:var(--muted);text-decoration:line-through}
.empty{padding:28px 12px;text-align:center;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px;justify-content:center}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:default}
.btn.sm{padding:5px 10px;font-size:13px}
.fab{position:fixed;right:max(18px,calc(env(safe-area-inset-right,0px) + 18px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:6;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:14px 20px;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(20,40,90,.28)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;border-top:0}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
details>summary{cursor:pointer;color:var(--ink-2);font-weight:600;font-size:13px;margin-top:10px}
/* chart */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .axis{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent}
.chart .col:hover .seg,.chart .col.on .seg{filter:brightness(1.12)}
.chart .col.sel .seg{stroke:var(--ink);stroke-width:0}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:8px;padding:8px 10px;font-size:12px;min-width:150px;z-index:3}
.tip .h{font-weight:700;margin-bottom:4px}
.tip .l{display:grid;grid-template-columns:12px 1fr auto;gap:6px;align-items:center}
.tip .k{height:2px;border-radius:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-bottom:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.hbar{display:grid;grid-template-columns:minmax(0,150px) 1fr auto;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .b{height:10px;background:var(--surface-2);border-radius:5px;overflow:hidden}
.hbar .b i{display:block;height:100%;background:var(--s3);border-radius:5px}
.hbar .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg-ctl{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.seg-ctl button{border:0;background:transparent;padding:6px 10px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink-2)}
.seg-ctl button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.ai{border-color:var(--accent);background:linear-gradient(0deg,var(--surface),var(--surface)) padding-box}
.ai-out{display:grid;gap:14px;margin-top:12px}
.ai-out ul{margin:6px 0 0;padding-left:18px}
.ai-out li{margin:4px 0}
.recipe{border:1px solid var(--line);border-radius:10px;padding:12px}
.jp{font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",var(--f-body);color:var(--muted);font-size:12px}
/* modal */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,28,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--ink);width:100%;max-width:620px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));overflow:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:18px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;font-size:18px}
.form{display:grid;gap:12px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600;color:var(--ink-2)}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:9px 10px;width:100%;min-width:0}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:440px){.f3{grid-template-columns:1fr 1fr}}
.items{display:grid;gap:6px}
.item{display:grid;grid-template-columns:1fr 92px 32px;gap:6px;align-items:start;padding:8px;border:1px solid var(--line);border-radius:9px}
.item .sub2{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 64px;gap:6px}
.item input,.item select{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:6px 8px;width:100%;min-width:0;font-size:13px}
.item .rm{border:0;background:transparent;color:var(--muted);font-size:18px;height:32px}
.menu{display:grid;gap:8px}
.menu button{display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px}
.menu button:hover{border-color:var(--accent)}
.menu .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-weight:700;color:#fff;font-size:13px}
.menu b{display:block} .menu small{color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:12px;padding:20px;text-align:center;display:grid;gap:10px;justify-items:center}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{height:80px;border-radius:6px;border:1px solid var(--line)}
.status{font-size:13px;color:var(--ink-2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 84px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:30}
.kpi{display:grid;gap:3px}
.pcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.pcol{background:var(--surface-2);border-radius:10px;padding:12px 12px 6px;min-width:0}
.pcol .card-h{padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:2px}
.pcol .tx{border-top:0;padding:9px 4px}
.pcol .tx + .tx{border-top:1px solid var(--line)}
.pcol .tx:hover{background:var(--surface)}
.kpi .v{font-size:20px;font-weight:700}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="brand-l">
        <div><h1>Расходы</h1><div class="sub" id="who-line">Марго и Миша</div></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <div class="monthnav" role="group" aria-label="Месяц">
          <button id="m-prev" aria-label="Предыдущий месяц">‹</button>
          <div class="m" id="m-label"></div>
          <button id="m-next" aria-label="Следующий месяц">›</button>
        </div>
        <button class="iconbtn" id="btn-settings" aria-label="Настройки">⚙ <span id="sync">…</span></button>
      </div>
    </div>
    <nav class="tabs" id="tabs">
      <a href="#month">Месяц</a>
      <a href="#utilities">Коммуналка</a>
      <a href="#food">Продукты</a>
      <a href="#regular">Подписки и связь</a>
      <a href="#stats">Статистика</a>
    </nav>
  </header>
  <div id="banner"></div>
  <main id="view"><div class="card empty">Загружаем данные…</div></main>
</div>
<button class="fab" id="fab">＋ Добавить</button>
<div id="modal"></div>

<script src="config.js"></script>
<script src="vendor.js"></script>
<script>
(() => {
"use strict";
// ---------- constants ----------
const CATS = {
  util:{ru:"Коммунальные", c:"var(--s1)", ic:"光"},
  sub:{ru:"Подписки", c:"var(--s2)", ic:"♺"},
  food:{ru:"Продукты", c:"var(--s3)", ic:"食"},
  tel:{ru:"Связь и интернет", c:"var(--s4)", ic:"☎"},
  other:{ru:"Другое", c:"var(--s5)", ic:"…"}
};
const CAT_ORDER = ["util","sub","food","tel","other"];
const UTIL = {
  electric:{ru:"Электричество", jp:"電気", unit:"кВт·ч", c:"var(--s1)"},
  gas:{ru:"Газ", jp:"ガス", unit:"м³", c:"var(--s2)"},
  water:{ru:"Вода", jp:"水道", unit:"м³", c:"var(--s3)"},
  rent:{ru:"Аренда", jp:"家賃", unit:"", c:"var(--s5)"},
  other:{ru:"Прочее (обслуживание и т.п.)", jp:"管理費", unit:"", c:"var(--s4)"}
};
const TEL = {mobile:"Мобильная связь", internet:"Домашний интернет", other:"Другое"};
const GROUPS = ["Овощи и фрукты","Мясо и рыба","Молочное и яйца","Тофу, натто, соевое","Рис, хлеб, лапша","Готовая еда и бэнто","Замороженное","Соусы и специи","Снеки и сладости","Напитки","Алкоголь","Бытовое (не еда)","Другое"];

// ---------- helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const yen = n => (n < 0 ? "−¥" : "¥") + Math.abs(Math.round(n || 0)).toLocaleString("en-US");
const yenK = n => n >= 10000 ? "¥" + (Math.round(n/1000)).toLocaleString("en-US") + "k" : yen(n);
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const curMonth = () => todayStr().slice(0,7);
const addMonths = (m, k) => { let [y, mo] = m.split("-").map(Number); mo += k; while (mo < 1) { mo += 12; y--; } while (mo > 12) { mo -= 12; y++; } return y + "-" + pad(mo); };
const monthName = (m, short) => { const [y, mo] = m.split("-").map(Number); const s = new Date(y, mo-1, 1).toLocaleString("ru-RU", short ? {month:"short"} : {month:"long", year:"numeric"}).replace(" г.", ""); return s.charAt(0).toUpperCase() + s.slice(1); };
const dayLabel = d => { const [y,m,dd] = d.split("-").map(Number); return new Date(y,m-1,dd).toLocaleString("ru-RU",{day:"numeric",month:"long",weekday:"short"}); };
const sum = (arr, f) => arr.reduce((a, x) => a + (Number(f ? f(x) : x) || 0), 0);
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const ls = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } }, set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };
let toastT; function toast(msg){ let t = $(".toast"); if (!t) { t = document.createElement("div"); t.className = "toast"; document.body.append(t); } t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }

// ---------- state ----------
const S = {
  expenses: [], recurring: [], settings: {a:"Марго", b:"Миша"}, insights: null,
  loaded: {expenses:false, recurring:false}, mode: "loading", // db | local | loading
  month: ls.get("kk-month", null) || curMonth(), tab: "month",
  foodRange: ls.get("kk-foodrange", "3"), canWrite: true
};
if (S.month > curMonth()) S.month = curMonth();
const whoName = w => w === "a" ? S.settings.a || "Марго" : w === "b" ? S.settings.b || "Миша" : "Общее";

// ---------- storage adapter ----------
const CFG = window.APP_CONFIG || {};
const configured = !!(CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/ВСТАВЬТЕ/.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY));
const sb = configured ? window.supabaseCreateClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY, {auth:{persistSession:true, autoRefreshToken:true}}) : null;
const store = {
  rows: new Map(), channel: null,
  key: (c, id) => c + "/" + id,
  apply(){
    const ex = [], rec = []; let settings = null, insights = null, secret = null;
    for (const r of this.rows.values()) {
      if (r.collection === "expenses") ex.push({...r.data, id:r.id});
      else if (r.collection === "recurring") rec.push({...r.data, id:r.id});
      else if (r.collection === "meta" && r.id === "settings") settings = r.data;
      else if (r.collection === "meta" && r.id === "food") insights = r.data;
      else if (r.collection === "secret" && r.id === "anthropic") secret = r.data;
    }
    S.expenses = ex; S.recurring = rec;
    S.settings = {a:"Марго", b:"Миша", ...(settings || {})};
    S.insights = insights; S.apiKey = secret && secret.key || "";
    S.loaded = {expenses:true, recurring:true};
    render();
  },
  async loadAll(){
    const all = []; const page = 1000;
    for (let from = 0; ; from += page) {
      const {data, error} = await sb.from("docs").select("collection,id,data").range(from, from + page - 1);
      if (error) throw error;
      all.push(...data); if (data.length < page) break;
    }
    this.rows = new Map(all.map(r => [this.key(r.collection, r.id), r]));
    S.syncNote = null; this.apply();
  },
  async start(){
    S.mode = "db";
    try { await this.loadAll(); } catch (e) { S.syncNote = "Не удалось загрузить данные: " + (e.message || e) + ". Проверьте интернет."; render(); }
    if (this.channel) sb.removeChannel(this.channel);
    this.channel = sb.channel("docs-live").on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
      if (p.eventType === "DELETE") { if (p.old && p.old.collection) this.rows.delete(this.key(p.old.collection, p.old.id)); else { this.loadAll().catch(() => {}); return; } }
      else if (p.new) this.rows.set(this.key(p.new.collection, p.new.id), p.new);
      this.apply();
    }).subscribe();
  },
  async put(col, id, data){
    const row = {collection:col, id, data, updated_at:new Date().toISOString()};
    const {error} = await sb.from("docs").upsert(row);
    if (error) throw error;
    this.rows.set(this.key(col, id), row); this.apply();
  },
  async add(col, data){ return this.put(col, uid(), data); },
  async del(col, id){
    const {error} = await sb.from("docs").delete().match({collection:col, id});
    if (error) throw error;
    this.rows.delete(this.key(col, id)); this.apply();
  },
  async setPaid(id, m, v){
    const r = this.rows.get(this.key("recurring", id)); if (!r) return;
    const data = {...r.data, paid:{...(r.data.paid || {}), [m]:v}};
    return this.put("recurring", id, data);
  },
  async meta(name, data){ return this.put("meta", name, data); }
};

// ---------- chart ----------
function niceMax(v){ if (v <= 0) return 1000; const p = Math.pow(10, Math.floor(Math.log10(v))); for (const k of [1, 1.5, 2, 2.5, 3, 4, 5, 6, 8, 10]) if (k*p >= v) return k*p; return 10*p; }
// cols: [{label, key, parts:{k:v}}], series: [{k,label,c}]
function stackChart(cols, series, opts = {}){
  const W = window.innerWidth < 560 ? 380 : 640, H = opts.h || 220, L = 46, B = 24, T = 8;
  const max = niceMax(Math.max(...cols.map(c => sum(series, s => c.parts[s.k] || 0)), 0));
  const y = v => T + (H - T - B) * (1 - v / max);
  const bw = (W - L) / cols.length; const barW = Math.min(36, bw * 0.62);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = max * i / 4; g += `<line class="grid" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L-6}" y="${y(v)+4}" text-anchor="end">${esc(yenK(v))}</text>`; }
  let bars = "";
  cols.forEach((c, i) => {
    const x = L + bw*i + (bw - barW)/2; let acc = 0; let segs = "";
    const vis = series.filter(s => (c.parts[s.k] || 0) > 0);
    vis.forEach((s, j) => {
      const v = c.parts[s.k]; const y1 = y(acc + v), y0 = y(acc); acc += v;
      const top = j === vis.length - 1; const h = Math.max(0, y0 - y1 - (top ? 0 : 2));
      segs += `<rect class="seg" x="${x}" y="${y1}" width="${barW}" height="${h}" rx="${top ? 3 : 0}" fill="${s.c}"/>`;
    });
    bars += `<g class="col${c.key === opts.sel ? " sel" : ""}" data-i="${i}" tabindex="0">${segs}<rect class="hit" x="${L + bw*i}" y="${T}" width="${bw}" height="${H - T}"/><text class="axis" x="${L + bw*i + bw/2}" y="${H - 6}" text-anchor="middle" ${c.key === opts.sel ? 'style="font-weight:700;fill:var(--ink)"' : ""}>${esc(c.label)}</text></g>`;
  });
  const id = "ch" + uid();
  setTimeout(() => wireChart(id, cols, series), 0);
  const legend = series.length > 1 ? `<div class="legend">${series.map(s => `<span><i class="sw" style="background:${s.c}"></i>${esc(s.label)}</span>`).join("")}</div>` : "";
  return `${legend}<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.aria || "График по месяцам")}">${g}${bars}</svg><div class="tip" hidden></div></div>`;
}
function wireChart(id, cols, series){
  const el = document.getElementById(id); if (!el) return; const tip = el.querySelector(".tip");
  const show = (g, ev) => {
    const c = cols[Number(g.dataset.i)]; const tot = sum(series, s => c.parts[s.k] || 0);
    tip.innerHTML = `<div class="h">${esc(c.full || c.label)} · <span class="num">${esc(yen(tot))}</span></div>` + series.filter(s => c.parts[s.k]).slice().reverse().map(s => `<div class="l"><i class="k" style="background:${s.c}"></i><span>${esc(s.label)}</span><b class="num">${esc(yen(c.parts[s.k]))}</b></div>`).join("");
    tip.hidden = false;
    const r = el.getBoundingClientRect(); const gr = g.getBoundingClientRect();
    let left = gr.left - r.left + gr.width/2 - tip.offsetWidth/2; left = Math.max(0, Math.min(left, r.width - tip.offsetWidth));
    tip.style.left = left + "px"; tip.style.top = Math.max(0, (ev && ev.clientY ? ev.clientY - r.top : 20) - tip.offsetHeight - 14) + "px";
  };
  el.querySelectorAll(".col").forEach(g => {
    g.addEventListener("pointermove", e => show(g, e));
    g.addEventListener("pointerleave", () => tip.hidden = true);
    g.addEventListener("focus", () => show(g)); g.addEventListener("blur", () => tip.hidden = true);
  });
}

function foodStats(months){
  const D = data();
  const rec = D.expenses.filter(e => e.cat === "food" && months.includes((e.date||"").slice(0,7)));
  const prod = {}, groups = {}, stores = {};
  rec.forEach(r => {
    stores[r.store || r.title || "—"] = (stores[r.store || r.title || "—"] || 0) + Number(r.amount || 0);
    (r.items || []).forEach(it => {
      const name = (it.ru || it.jp || "?").trim(); const key = name.toLowerCase();
      const p = prod[key] || (prod[key] = {name, jp:it.jp || "", group:it.group || "Другое", n:0, spend:0});
      p.n += Number(it.qty) || 1; p.spend += Number(it.price) || 0;
      groups[it.group || "Другое"] = (groups[it.group || "Другое"] || 0) + (Number(it.price) || 0);
    });
  });
  const P = Object.values(prod);
  return {rec, total:sum(rec, r => r.amount), byCount:P.slice().sort((a,b) => b.n - a.n || b.spend - a.spend), bySpend:P.slice().sort((a,b) => b.spend - a.spend), groups:Object.entries(groups).sort((a,b) => b[1]-a[1]), stores:Object.entries(stores).sort((a,b) => b[1]-a[1])};
}

// ---------- Claude API ----------
const MODEL = "claude-opus-5-5";
function claudeClient(){ return S.apiKey ? new window.Anthropic({apiKey:S.apiKey, dangerouslyAllowBrowser:true, maxRetries:1}) : null; }
const RECEIPT_SCHEMA = {type:"object", additionalProperties:false, required:["store","date","total","taxIncluded","items"], properties:{
  store:{type:"string"}, date:{type:["string","null"]}, total:{type:"integer"}, taxIncluded:{type:"boolean"},
  items:{type:"array", items:{type:"object", additionalProperties:false, required:["jp","ru","group","qty","price"], properties:{
    jp:{type:"string"}, ru:{type:"string"}, group:{type:"string", enum:GROUPS}, qty:{type:"integer"}, price:{type:"integer"}}}}}};
const INSIGHTS_SCHEMA = {type:"object", additionalProperties:false, required:["summary","nutrition","recipes","swaps","tips"], properties:{
  summary:{type:"string"},
  nutrition:{type:"array", items:{type:"object", additionalProperties:false, required:["title","text"], properties:{title:{type:"string"}, text:{type:"string"}}}},
  recipes:{type:"array", items:{type:"object", additionalProperties:false, required:["name","jp","ingredients","steps","costYen","minutes"], properties:{name:{type:"string"}, jp:{type:"string"}, ingredients:{type:"array", items:{type:"string"}}, steps:{type:"string"}, costYen:{type:"integer"}, minutes:{type:"integer"}}}},
  swaps:{type:"array", items:{type:"object", additionalProperties:false, required:["from","to","saving","note"], properties:{from:{type:"string"}, to:{type:"string"}, saving:{type:"string"}, note:{type:"string"}}}},
  tips:{type:"array", items:{type:"string"}}}};
async function askClaude(content, schema, signal){
  const client = claudeClient(); if (!client) throw {code:"no_key"};
  const res = await client.beta.messages.create({
    model:MODEL, max_tokens:16000,
    betas:["server-side-fallback-2026-07-01"], fallbacks:"default",
    output_config:{effort:"medium", format:{type:"json_schema", schema}},
    messages:[{role:"user", content}]
  }, {signal});
  if (res.stop_reason === "refusal") throw {code:"refused"};
  if (res.stop_reason === "max_tokens") throw {code:"too_long"};
  const text = res.content.filter(b => b.type === "text").map(b => b.text).join("");
  try { return JSON.parse(text); } catch { throw {code:"invalid_json"}; }
}
function claudeErr(e){
  const A = window.Anthropic;
  if (e && e.code === "no_key") return "Добавьте ключ Claude API в настройках (⚙).";
  if (e && e.code === "refused") return "Claude не смог обработать этот запрос.";
  if (e && e.code === "too_long") return "Ответ получился слишком длинным — попробуйте ещё раз.";
  if (e && e.code === "invalid_json") return "Не получилось разобрать ответ — попробуйте ещё раз.";
  if (A && e instanceof A.APIUserAbortError) return "Остановлено.";
  if (A && e instanceof A.AuthenticationError) return "Ключ Claude API не подходит. Проверьте его в настройках.";
  if (A && e instanceof A.PermissionDeniedError) return "У ключа нет доступа. Проверьте ключ и баланс в консоли Anthropic.";
  if (A && e instanceof A.RateLimitError) return "Слишком много запросов — попробуйте через минуту.";
  if (A && e instanceof A.BadRequestError) return /credit|balance/i.test(e.message || "") ? "На счёте Anthropic закончились деньги — пополните баланс." : "Запрос отклонён: " + (e.message || "");
  if (A && e instanceof A.APIConnectionError) return "Нет связи с Claude. Проверьте интернет.";
  if (A && e instanceof A.APIError) return "Ошибка Claude (" + (e.status || "?") + "). Попробуйте ещё раз.";
  return "Не получилось — попробуйте ещё раз.";
}
async function toBase64Jpeg(file){
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
  const url = c.toDataURL("image/jpeg", 0.85);
  return {url, data:url.split(",")[1]};
}

    go.addEventListener("click", async () => {

Правила:
- total — итог к оплате в иенах с налогом (合計 / お買上計 / 領収金額), целое число.

- jp — строка товара как в чеке. ru — короткое нормализованное название по-русски без бренда, веса и упаковки: "Куриное бедро", "Молоко", "Яйца", "Тофу", "Онигири". Если товар не распознан — транслитерация и "(?)".

- store — название магазина как на чеке.`;

        const res = await askClaude(content, RECEIPT_SCHEMA, ctl.signal);
        const items = (Array.isArray(res.items) ? res.items : []).map(i => ({jp:String(i.jp || ""), ru:String(i.ru || i.jp || ""), group:GROUPS.includes(i.group) ? i.group : "Другое", qty:Math.max(1, Math.round(Number(i.qty) || 1)), price:Math.round(Number(i.price) || 0)}));
        const total = Math.round(Number(res.total) || 0) || Math.round(sum(items, i => i.price) * (res.taxIncluded === false ? 1.08 : 1));
        const date = /^\d{4}-\d{2}-\d{2}$/.test(res.date || "") ? res.date : todayStr();
        expenseForm({cat:"food", title:res.store || "Супермаркет", store:res.store || "", date, amount:total, who, items}, {title:"Проверьте чек"});
        toast(`Распознано позиций: ${items.length}. Проверьте и сохраните.`);
      } catch (e) {
        stop.hidden = true; go.disabled = false; st.textContent = claudeErr(e);
      }
    });
  });
}
async function runInsights(){
  const stEl = $("#ai-status"); const out = $("#ai-out"); const btn = document.querySelector('[data-act="insights"]');
  if (!S.apiKey) { stEl.textContent = "Добавьте ключ Claude API в настройках (⚙)."; return; }
  const months = monthsBack(S.month, Number(S.foodRange)); const st = foodStats(months);
  const lines = st.byCount.slice(0, 45).map(p => `${p.name}${p.jp ? " (" + p.jp + ")" : ""}: куплено ${p.n} раз, всего ¥${Math.round(p.spend)}, ~¥${Math.round(p.spend / p.n)} за раз, группа «${p.group}»`).join("\n");
  const groups = st.groups.map(([g, v]) => `${g}: ¥${Math.round(v)}`).join("; ");
  const perMonth = months.map(mm => `${mm}: ¥${Math.round(foodStats([mm]).total)}`).join("; ");
  const prompt = `Ты помощник по питанию и семейному бюджету. Пара из двух взрослых живёт в Японии и покупает продукты в японских супермаркетах (スーパー, 業務スーパー, ドラッグストア, コンビニ). Ниже их покупки за ${months.length} мес. по чекам.

Расходы на продукты по месяцам: ${perMonth}
По группам: ${groups}
Продукты (по частоте):
${lines}

Дай практичные советы на русском языке:
- summary: 2–3 предложения, общая картина питания и трат.
- nutrition (3–5): чего не хватает или что в избытке и что конкретно добавить.
- recipes (4): блюда в основном из их частых покупок; jp — японское название, если блюдо японское, иначе пустая строка; steps — 2–3 предложения; costYen — примерная стоимость на двоих; minutes — время готовки.
- swaps (4–6): дорогой продукт из их списка → более дешёвая замена с японским названием для поиска в магазине; saving — например «≈¥800 в месяц»; note — где искать или почему.
- tips (3–5): советы по экономии именно в Японии (вечерние скидки 値引き/半額, сезонные продукты 旬, ポイントカード, 業務スーパー, заморозка), с привязкой к их покупкам.
Цены — реалистичные для Японии 2026 года.`;
  btn.disabled = true; out.dataset.busy = "1"; stEl.innerHTML = `<span class="spin"></span> Claude анализирует покупки… это может занять минуту`;
  try {
    const d = await askClaude(prompt, INSIGHTS_SCHEMA);
    out.dataset.busy = ""; out.innerHTML = renderInsights(d); stEl.textContent = "";
    await safe(store.meta("food", {generatedAt:Date.now(), months, data:d}));
  } catch (e) { out.dataset.busy = ""; stEl.textContent = claudeErr(e); }
  finally { btn.disabled = false; }
}

// ---------- auth ----------
function authView(){
  $("#tabs").hidden = true; $("#fab").hidden = true; $("#banner").innerHTML = "";
  if (!configured) { $("#view").innerHTML = `<section class="card"><h2>Почти готово</h2><p class="ink2">Приложение ещё не подключено к базе данных. Впишите адрес и ключ Supabase в файл <b>config.js</b> — инструкция в README.</p></section>`; return; }
  $("#view").innerHTML = `<section class="card" style="max-width:420px;margin:24px auto 0;width:100%">
    <h2 style="margin-bottom:14px">Вход</h2>
    <form class="form" id="af" novalidate>
      <div class="f"><label for="a-email">Почта</label><input id="a-email" name="email" type="email" autocomplete="email" required></div>
      <div class="f"><label for="a-pass">Пароль</label><input id="a-pass" name="pass" type="password" autocomplete="current-password" minlength="6" required></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" style="flex:1">Войти</button><button class="btn" type="button" id="a-signup" style="flex:1">Создать аккаунт</button></div>
      <div class="status" id="a-status"></div>
    </form></section>`;
  const f = $("#af"), st = $("#a-status");
  const go = async signup => {
    const email = f.email.value.trim(), password = f.pass.value;
    if (!email || password.length < 6) { st.textContent = "Введите почту и пароль не короче 6 символов."; return; }
    st.innerHTML = `<span class="spin"></span> Подождите…`;
    const {data, error} = signup ? await sb.auth.signUp({email, password, options:{emailRedirectTo:location.origin + location.pathname}}) : await sb.auth.signInWithPassword({email, password});
    if (error) { st.textContent = /Invalid login/i.test(error.message) ? "Неверная почта или пароль. Если входите впервые — нажмите «Создать аккаунт»." : /already registered/i.test(error.message) ? "Такой аккаунт уже есть — нажмите «Войти»." : /not allowed|disabled/i.test(error.message) ? "Регистрация закрыта. Попросите Марго открыть её в Supabase." : error.message; return; }
    if (signup && !data.session) st.textContent = "Аккаунт создан. Подтвердите почту по ссылке из письма, затем войдите.";
  };
  f.addEventListener("submit", e => { e.preventDefault(); go(false); });
  $("#a-signup").addEventListener("click", () => go(true));
}
async function boot(){
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
  if (!sb) { authView(); return; }
  const linkErr = /error_code=otp_expired|error=access_denied/.test(location.hash);
  if (/(^#|&)(error|access_token)=/.test(location.hash)) setTimeout(() => history.replaceState(null, "", location.pathname + "#month"), 0);
  const {data} = await sb.auth.getSession();
  S.session = data.session;
  if (S.session) { $("#tabs").hidden = false; store.start(); } else authView();
  if (!S.session && linkErr) { const st = $("#a-status"); if (st) st.textContent = "Ссылка из письма устарела. Войдите с почтой и паролем или создайте аккаунт заново."; }
  sb.auth.onAuthStateChange((ev, session) => {
    const was = !!S.session; S.session = session;
    if (session && !was) { $("#tabs").hidden = false; store.start(); }
    if (!session && was) { S.mode = "loading"; store.rows.clear(); S.expenses = []; S.recurring = []; authView(); }
  });
}

// ---------- events ----------
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, id = t.dataset.id;
  if (a === "paid") return; // handled by change
  const D = data();
  if (a === "edit-exp") expenseForm(D.expenses.find(x => x.id === id) || {});
  else if (a === "edit-rec") recForm(D.recurring.find(x => x.id === id) || {});
  else if (a === "new-exp") { closeModal(); expenseForm({cat:t.dataset.cat}); }
  else if (a === "new-rec") { closeModal(); recForm({}, t.dataset.cat); }
  else if (a === "scan") { closeModal(); scanFlow(); }
  else if (a === "foodrange") { S.foodRange = t.dataset.v; ls.set("kk-foodrange", S.foodRange); render(); }
  else if (a === "insights") runInsights();
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".tx[role=button]")) { e.preventDefault(); e.target.click(); } });
document.addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.act === "paid") safe(store.setPaid(t.dataset.id, S.month, t.checked)); });
$("#fab").addEventListener("click", addMenu);
$("#btn-settings").addEventListener("click", settingsForm);
$("#m-prev").addEventListener("click", () => { S.month = addMonths(S.month, -1); ls.set("kk-month", S.month); render(); });
$("#m-next").addEventListener("click", () => { if (S.month < curMonth()) { S.month = addMonths(S.month, 1); ls.set("kk-month", S.month); render(); } });
window.addEventListener("hashchange", render);

boot();
})();
</script>
